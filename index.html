<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#000">
<title>GhostRev</title>
<meta name="description" content="GhostRev: real combustion engine sound for your EV, driven by GPS.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23000'/><path d='M5 21V11a7 7 0 0 1 14 0v10l-2.3-1.6L14.3 21 12 19.4 9.7 21l-2.4-1.6z' fill='none' stroke='%23ff6a13' stroke-width='2' stroke-linejoin='round'/><circle cx='9.5' cy='11' r='1.2' fill='%23ff6a13'/><circle cx='14.5' cy='11' r='1.2' fill='%23ff6a13'/></svg>">
<style>
  :root { --bg:#000; --fg:#f4f4f4; --dim:#7d828a; --glow:#ff6a13; --needle:#ff4d0a; --red:#e3191b; --line:#1f2328; --blue:#3a8dff; --chip:#121418; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--fg); font:14px/1.25 "Helvetica Neue",Helvetica,Arial,sans-serif; user-select:none; }
  body { display:grid; grid-template-rows:auto 1fr; gap:10px; padding:10px 14px 14px; }
  button { font:inherit; color:var(--fg); background:var(--chip); border:1px solid #23272d; border-radius:9px; padding:7px 12px; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
  button.on { border-color:var(--glow); background:#21140b; color:#ffd7bd; }

  /* ---------- top bar: compact chips ---------- */
  #bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #cars { display:flex; gap:6px; }
  .grp { display:flex; gap:4px; padding:3px; border:1px solid var(--line); border-radius:12px; }
  .grp button { border-color:transparent; }
  .sp { flex:1; }
  #brand { display:flex; align-items:center; gap:6px; margin-right:6px; font-weight:800; letter-spacing:.18em; font-size:13px; }
  #brand b { color:var(--glow); font-weight:800; }
  #brand .ico { color:var(--glow); filter:drop-shadow(0 0 6px rgba(255,106,19,.6)); }
  #brand .ico svg { width:22px; height:22px; }
  .vol { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:12px; }
  .vol input { width:140px; accent-color:var(--glow); }
  .ico, .ic { display:inline-flex; align-items:center; justify-content:center; }
  .ico svg, .ic svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  button.ic { width:40px; height:34px; padding:0; }
  .grp button.ic { width:44px; }
  #pops.on { color:#ff8a3d; box-shadow:0 0 12px rgba(255,106,19,.35) inset; }
  .unitbtn { font-size:12px; letter-spacing:.06em; height:34px; }
  #info { color:var(--dim); }
  .mini .ico svg { width:14px; height:14px; }

  /* ---------- cockpit: brake | speedo | center | tach | gas ---------- */
  #cockpit { min-height:0; display:grid; grid-template-columns:auto 1fr minmax(170px,.55fr) 1fr auto; align-items:center; gap:1.5%;
             padding:1.5% 2%; border-radius:26px; border:1px solid var(--line); background:radial-gradient(120% 90% at 50% 100%,#14100c 0%,#030303 60%); }
  .dial { position:relative; width:min(100%, calc(100vh - 110px)); aspect-ratio:1; justify-self:center; }
  .dial svg { position:absolute; inset:0; width:100%; height:100%; }
  .needle { position:absolute; left:50%; top:50%; width:2.2%; height:44%; margin-left:-1.1%; transform-origin:50% 0;
            background:linear-gradient(var(--needle) 0 70%, #ff9a4a 100%); border-radius:2px; box-shadow:0 0 10px rgba(255,90,10,.55); transform:rotate(45deg); will-change:transform; }
  .hub { position:absolute; left:50%; top:50%; width:13%; height:13%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle at 40% 35%,#3a3d42,#0b0c0e 70%); border:1px solid #2b2e33; }
  .dial .lab { position:absolute; left:0; right:0; top:66%; text-align:center; color:var(--dim); font-size:clamp(10px,1.1vw,14px); letter-spacing:.12em; }
  .dial .dig { position:absolute; left:0; right:0; top:72%; text-align:center; font-size:clamp(18px,2.5vw,34px); font-weight:300; font-variant-numeric:tabular-nums; }

  #center { display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; }
  #lcd { width:100%; border-radius:14px; padding:12px 8px; background:linear-gradient(#0d0f12,#050607); border:1px solid #23272d; box-shadow:inset 0 0 22px rgba(255,106,19,.08); }
  #gear { font-size:clamp(48px,7vw,100px); font-weight:700; line-height:1; color:var(--glow); text-shadow:0 0 18px rgba(255,106,19,.45); font-variant-numeric:tabular-nums; }
  #msg { font-size:clamp(11px,1.15vw,15px); letter-spacing:.14em; margin-top:6px; min-height:1.3em; color:#ffd7bd; }
  #msg.ok { color:#2fd067; } #msg.cold { color:var(--blue); } #msg.warn { color:#ffb21e; }
  #carname { font-size:clamp(12px,1.2vw,16px); margin-top:6px; }
  #status { color:var(--dim); font-size:11px; margin-top:3px; min-height:1.2em; } #status.warn { color:#ffb21e; }
  .mini { width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:5px 8px; align-items:center; font-size:10px; color:var(--dim); letter-spacing:.1em; }
  .mini em { font-style:normal; font-variant-numeric:tabular-nums; min-width:3.2em; text-align:right; }
  .mbar { height:5px; border-radius:3px; background:#15181c; overflow:hidden; }
  .mbar i { display:block; height:100%; width:100%; background:var(--glow); transform-origin:0 50%; transform:scaleX(0); will-change:transform; }
  #temp i { background:linear-gradient(90deg,var(--blue),#2fd067 60%,var(--glow)); }
  #lights { display:flex; gap:6px; justify-content:center; height:9px; }
  #lights b { width:20px; height:8px; border-radius:4px; background:#1a1d21; }
  #lights b.g { background:#2fd067; box-shadow:0 0 8px #2fd067; } #lights b.y { background:#ffb21e; box-shadow:0 0 8px #ffb21e; } #lights b.r { background:var(--red); box-shadow:0 0 10px var(--red); }
  #lights.flash b { animation:fl .12s steps(2) infinite; } @keyframes fl { 50% { opacity:.15; } }
  #start { width:92px; height:92px; border-radius:50%; border:3px solid #3a3d42; padding:0; color:#fff;
           background:radial-gradient(circle at 50% 35%,#2b2e33,#0c0d0f 70%); box-shadow:0 0 0 5px #111316, inset 0 -6px 14px rgba(0,0,0,.7);
           font:700 11px/1.2 inherit; letter-spacing:.12em; white-space:normal; }
  #start .ico svg { width:30px; height:30px; stroke-width:2.2; }
  #start small { display:block; font-size:9px; color:var(--dim); font-weight:600; letter-spacing:.2em; margin-top:3px; }
  #start.running .ico { color:var(--glow); filter:drop-shadow(0 0 6px rgba(255,106,19,.8)); }
  #start.running { border-color:var(--glow); box-shadow:0 0 0 5px #111316, 0 0 24px rgba(255,106,19,.55), inset 0 -6px 14px rgba(0,0,0,.7); }
  #start.busy { border-color:#ffb21e; }

  /* pedals: full cockpit height, ribbed; a live fill + three big chevrons show how hard each one is pressed.
   * Test mode: you press them. GPS mode: they show the throttle/braking read from the sensors; gas = REV when parked. */
  .pedal { position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; align-self:stretch;
           width:clamp(76px,8.5vw,128px); margin:2% 0; border-radius:18px; padding:0; border:2px solid #2a2e34;
           background:repeating-linear-gradient(0deg,#1a1d22 0 10px,#0e1013 10px 16px); }
  .pedal .fill { position:absolute; inset:0; transform-origin:50% 100%; transform:scaleY(0); will-change:transform;
                 background:linear-gradient(to top, rgba(47,208,103,.55), rgba(47,208,103,.06)); }
  #brk .fill { transform-origin:50% 0; background:linear-gradient(to bottom, rgba(255,59,48,.55), rgba(255,59,48,.06)); }
  .chev { position:relative; display:flex; flex-direction:column; align-items:center; }
  .chev svg { width:clamp(46px,5.6vw,78px); height:clamp(34px,4.2vw,58px); fill:none; stroke:#353a41; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; transition:stroke .08s; }
  #gas .chev svg.lit { stroke:#38e27a; filter:drop-shadow(0 0 7px rgba(56,226,122,.8)); }
  #brk .chev svg.lit { stroke:#ff4b40; filter:drop-shadow(0 0 7px rgba(255,75,64,.8)); }
  .pedal .tag { position:absolute; left:0; right:0; bottom:14px; font-size:12px; font-weight:700; letter-spacing:.24em; color:#38e27a; }
  #gas.held { border-color:#2fd067; box-shadow:0 0 22px rgba(47,208,103,.45); }
  #brk.held { border-color:var(--red); box-shadow:0 0 22px rgba(227,25,27,.45); }
  body.gps #brk { pointer-events:none; }

  dialog { margin:auto; max-width:640px; background:#0b0c0e; color:var(--fg); border:1px solid #2a2e34; border-radius:16px; padding:18px; font-size:12px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog a { color:#c9cdd3; } dialog li { margin:6px 0 0 16px; } dialog h3 { font-size:14px; margin-bottom:6px; }

  @media (max-aspect-ratio: 4/3) {   /* portrait / narrow: stack the centre above the dials */
    html,body { overflow:auto; height:auto; }
    #cockpit { grid-template-columns:auto 1fr 1fr auto; }
    #center { grid-column:1 / -1; grid-row:1; }
    .dial { width:100%; }
  }
</style>
</head>
<body class="gps">
<header id="bar">
  <div id="brand"><span class="ico" data-i="ghost"></span>GHOST<b>REV</b></div>
  <div id="cars"></div>
  <div class="sp"></div>
  <div class="grp"><button id="mGps" class="on ic" data-i="gps" title="GPS drive" aria-label="GPS drive"></button><button id="mTest" class="ic" data-i="wheel" title="Test drive" aria-label="Test drive"></button></div>
  <button id="units" class="unitbtn">km/h</button>
  <button id="pops" class="ic" data-i="flame" title="Exhaust crackle" aria-label="Exhaust crackle"></button>
  <div class="vol"><span class="ico" data-i="vol"></span><input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume"><span id="volv">80</span></div>
  <button id="info" class="ic" data-i="info" title="Sound credits" aria-label="Sound credits"></button>
</header>

<main id="cockpit">
  <button class="pedal" id="brk" aria-label="Brake"><i class="fill"></i><span class="chev" data-dir="down"></span></button>
  <div class="dial"><svg id="spdSvg" viewBox="0 0 200 200"></svg><div class="needle" id="spdN"></div><div class="hub"></div>
    <div class="lab" id="unit">KM/H</div><div class="dig" id="speed">0</div></div>
  <div id="center">
    <div id="lights"><b></b><b></b><b></b><b></b><b></b></div>
    <div id="lcd">
      <div id="gear">P</div><div id="msg">READY TO START</div>
      <div id="carname">–</div><div id="status">Allow location</div>
    </div>
    <button id="start" aria-label="Engine start / stop"><span class="ico" data-i="power"></span><small>START</small></button>
    <div class="mini">
      <span class="ico" data-i="gauge" title="Load"></span><div class="mbar" id="thr"><i></i></div><em id="thrv">0%</em>
      <span class="ico" data-i="temp" title="Coolant"></span><div class="mbar" id="temp"><i></i></div><em id="tempv">–</em>
    </div>
  </div>
  <div class="dial"><svg id="rpmSvg" viewBox="0 0 200 200"></svg><div class="needle" id="rpmN"></div><div class="hub"></div>
    <div class="lab">1/min ×1000</div><div class="dig" id="rpm">0</div></div>
  <button class="pedal" id="gas" aria-label="Gas / rev"><i class="fill"></i><span class="chev" data-dir="up"></span><small class="tag" id="gastag"></small></button>
</main>

<dialog id="credits"><h3>Sound credits</h3><p>Real recordings, CC BY 3.0 via Wikimedia Commons, cut into pitch-marked grains and single exhaust pops.</p><ul id="credlist"></ul><p style="margin-top:12px"><button onclick="this.closest('dialog').close()">Close</button></p></dialog>

<script>
'use strict';
/* ---------- Engine voice: native Web Audio, no per-sample JavaScript ----------
 * Each car has steady real loops at fixed rpm points (sounds/<car>.ogg + .json, built offline
 * from recorded passes through each rpm). All loops play continuously; the two around the
 * current rpm are equal-power crossfaded and every loop's playbackRate is rpm / loopRpm, so the
 * pitch glides. Throttle opens a low-pass and raises the level; pops are one-shot recordings.
 * Every change goes through setTargetAtTime, so nothing ever steps or clicks. */
function makeEngine(ctx, out) {
  const p = { rpm:0, load:0, cut:0, over:0, fire:1, starter:0, pops:1, gain:0 };
  let loops = [], red = 7000, cyl = 8, popBuf = null, popKinds = {}, trainEnd = 0;
  const vol = ctx.createGain(); vol.gain.value = 0; vol.connect(out);
  const lvl = ctx.createGain(); lvl.gain.value = 0;
  const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.Q.value = 0.6; tone.frequency.value = 2000;
  const sat = ctx.createWaveShaper(), cv = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; cv[i] = Math.tanh(1.8 * x) / Math.tanh(1.8); }
  sat.curve = cv;
  const bus = ctx.createGain(); bus.gain.value = 0.9;
  // body: recordings from video lose the low end; a low shelf brings back the weight, a high-pass keeps it clean
  const shelf = ctx.createBiquadFilter(); shelf.type = 'lowshelf'; shelf.frequency.value = 120; shelf.gain.value = 5;
  const clean = ctx.createBiquadFilter(); clean.type = 'highpass'; clean.frequency.value = 30; clean.Q.value = 0.7;
  bus.connect(tone).connect(shelf).connect(sat).connect(clean).connect(lvl).connect(vol);
  // rumble: sines locked to the firing frequency and half of it (the felt thump of each firing),
  // strongest at idle and low rpm, gone by the time the firing frequency leaves the bass range
  const b1 = ctx.createOscillator(), b2 = ctx.createOscillator(), bG = ctx.createGain(), bLP = ctx.createBiquadFilter();
  b1.type = b2.type = 'sine'; bLP.type = 'lowpass'; bLP.frequency.value = 160; bG.gain.value = 0;
  const b2G = ctx.createGain(); b2G.gain.value = 0.6;
  b1.connect(bLP); b2.connect(b2G).connect(bLP); bLP.connect(bG).connect(clean); b1.start(); b2.start();
  // crackle runs through the engine's own tone and saturation, so it sounds like the same exhaust
  const popBus = ctx.createGain(); popBus.gain.value = 0.55; popBus.connect(bus);
  // starter motor: geared whir that sags on every compression stroke (~14 Hz while cranking)
  const st = ctx.createOscillator(), stF = ctx.createBiquadFilter(), stG = ctx.createGain(), lfo = ctx.createOscillator(), lfoA = ctx.createGain(), lfoF = ctx.createGain();
  st.type = 'triangle'; st.frequency.value = 230; stF.type = 'bandpass'; stF.frequency.value = 650; stF.Q.value = 0.9; stG.gain.value = 0;
  lfo.frequency.value = 14; lfoA.gain.value = 0; lfoF.gain.value = 30;
  lfo.connect(lfoA).connect(stG.gain); lfo.connect(lfoF).connect(st.frequency);
  st.connect(stF).connect(stG).connect(vol); st.start(); lfo.start();
  const T = (param, v, tau) => param.setTargetAtTime(v, ctx.currentTime, tau);
  function pop(kind, g, delay = 0) {
    const list = popKinds[kind]; if (!popBuf || !list) return 0;
    const [, off, len] = list[(Math.random() * list.length) | 0];
    const s = ctx.createBufferSource(), pg = ctx.createGain();
    s.buffer = popBuf; s.playbackRate.value = 0.92 + 0.16 * Math.random(); pg.gain.value = g;
    s.connect(pg).connect(popBus);
    s.start(ctx.currentTime + delay, off, len);
    return len;
  }
  // overrun: a real recorded crackle sequence, then a pause before the next one
  function train(intensity) {
    const list = popKinds.t; if (!popBuf || !list) return;
    const len = pop('t', 0.3 + 0.4 * intensity * (0.6 + 0.4 * Math.random()));
    trainEnd = ctx.currentTime + len + 0.6 + Math.random() * 1.4;   // a few crackles, not a constant rattle
  }
  function apply() {
    const rpm = Math.max(p.rpm, 1);
    if (loops.length) {
      // the two loops around rpm; below the lowest loop it just slows down (cranking chug)
      let k = 0; while (k < loops.length - 1 && loops[k + 1].rpm <= rpm) k++;
      const a = loops[k], b = loops[Math.min(k + 1, loops.length - 1)];
      const x = a === b || rpm <= a.rpm ? 0 : Math.min(1, Math.log(rpm / a.rpm) / Math.log(b.rpm / a.rpm));
      for (const l of loops) {
        T(l.src.playbackRate, Math.min(4, Math.max(0.05, rpm / l.rpm)), 0.03);
        T(l.g.gain, l === a ? Math.cos(x * Math.PI / 2) : l === b ? Math.sin(x * Math.PI / 2) : 0, 0.06);
      }
    }
    T(tone.frequency, (700 + 6000 * p.load + rpm * 0.5) * (0.35 + 0.65 * p.fire), 0.05);
    const ff = rpm * cyl / 120;                       // firing frequency
    T(b1.frequency, ff, 0.03); T(b2.frequency, ff / 2, 0.03);
    T(bG.gain, p.rpm > 30 ? (0.10 + 0.08 * p.load) * clamp((260 - ff) / 180, 0, 1) * (0.4 + 0.6 * p.fire) : 0, 0.06);
    const on = p.rpm > 30 ? 1 : 0;
    T(lvl.gain, on * (0.55 + 0.45 * p.load) * (0.75 + 0.35 * Math.min(1, rpm / red)) * (1 - 0.45 * p.cut) * (0.3 + 0.7 * p.fire), p.cut ? 0.012 : 0.05);
    T(vol.gain, p.gain, 0.08);
    T(stG.gain, p.starter * 0.035, 0.05); T(lfoA.gain, p.starter * 0.025, 0.05);
    // overrun: unburnt fuel lights off in the hot exhaust, more often at high rpm
    if (p.pops && p.over > 0.2 && ctx.currentTime > trainEnd && Math.random() < (0.02 + 0.08 * p.over) * Math.min(1.3, rpm / 3500)) train(p.over);
  }
  return {
    setCar(buf, meta, carRed, carCyl) {
      red = carRed; cyl = carCyl;
      for (const l of loops) { T(l.g.gain, 0, 0.05); l.src.stop(ctx.currentTime + 0.4); }
      loops = meta.map(m => {
        const src = ctx.createBufferSource(), g = ctx.createGain();
        src.buffer = buf; src.loop = true; src.loopStart = m.start; src.loopEnd = m.start + m.len; g.gain.value = 0;
        src.connect(g).connect(bus);
        src.start(0, m.start + Math.random() * m.len);
        return { rpm:m.rpm, src, g };
      });
      apply();
    },
    setPops(buf, kinds) { popBuf = buf; popKinds = {}; for (const k of kinds) (popKinds[k[0]] = popKinds[k[0]] || []).push(k); },
    set(m) {
      // full-throttle upshift: one bang, then a crackle or two
      if (m.bang && p.pops && ctx.currentTime > trainEnd) { const len = pop('t', 0.4); trainEnd = ctx.currentTime + len + 0.5; }
      for (const k in m) if (k !== 'bang') p[k] = m[k];
      apply();
    }
  };
}

/* ---------- Cars (rpm loops in sounds/<id>.ogg + .json) ---------- */
const CARS = [
  { id:'v8',  cyl:8, name:'V8',         idle:925,  red:7000, gears:[2.97,2.07,1.43,1.0,0.71,0.57],          final:3.42, power:4.4,
    credit:{ t:'Chevrolet Corvette C6 Z06 - engine and exhaust sound', a:'Neighborhood Car Reviews (YouTube)', u:'https://commons.wikimedia.org/wiki/File:Chevrolet_Corvette_C6_Z06_-_engine_and_exhaust_sound_(YouTube_N3I-54kjT7I).opus' } },
  { id:'f6',  cyl:6, name:'Flat-6',     idle:864,  red:9000, gears:[3.75,2.38,1.72,1.34,1.11,0.96,0.84],     final:4.47, power:5.0,
    credit:{ t:'Porsche 911 GT3 (992) with Fi Exhaust - engine and exhaust sound', a:'CARSMANIA (YouTube)', u:'https://commons.wikimedia.org/wiki/File:Porsche_911_GT3_(992)_with_Fi_Exhaust_-_engine_and_exhaust_sound_(YouTube_-ZK8A1PT-4k).opus' } },
  { id:'i4',  cyl:4, name:'Turbo 4',    idle:828,  red:7200, gears:[3.87,2.47,1.65,1.21,1.0,0.83,0.68,0.56], final:3.47, power:4.2,
    credit:{ t:'Mercedes-Benz A 45 S AMG (W177) with Fi Exhaust - engine and exhaust sound', a:'FiExhaust (YouTube)', u:'https://commons.wikimedia.org/wiki/File:Mercedes-Benz_A_45_S_AMG_(W177)_with_Fi_Exhaust_-_engine_and_exhaust_sound_(YouTube_K6CgMnEOjzs).opus' } },
];
// sounds/pops.ogg: real overrun crackle sequences cut from recordings (2-7 pops, original timing) [kind, start s, length s]
const POPS = [["t",0,0.48],["t",0.53,0.58],["t",1.16,0.34],["t",1.55,0.48],["t",2.08,0.52],["t",2.65,1.04],["t",3.74,0.68],["t",4.47,0.75],["t",5.27,0.45],["t",5.77,0.6],["t",6.42,0.56],["t",7.03,0.38],["t",7.46,1.02],["t",8.53,0.38],["t",8.96,0.58],["t",9.59,0.38],["t",10.02,0.34],["t",10.41,0.43]];
const POP_CREDITS = [{"t": "BMW M3 Competition with Fi Exhaust - engine and exhaust sound", "a": "FiExhaust (YouTube)", "u": "https://commons.wikimedia.org/wiki/File:BMW_M3_Competition_with_Fi_Exhaust_-_engine_and_exhaust_sound_(YouTube_kUIorGHpeVg).opus"}, {"t": "McLaren 570S with Fi Exhaust system - engine and exhaust sound", "a": "FiExhaust (YouTube)", "u": "https://commons.wikimedia.org/wiki/File:McLaren_570S_with_Fi_Exhaust_system_-_engine_and_exhaust_sound_(YouTube_dBRIVYIzRm4).opus"}, {"t": "Porsche Macan GTS with Fi Exhaust system - engine and exhaust sound", "a": "FiExhaust (YouTube)", "u": "https://commons.wikimedia.org/wiki/File:Porsche_Macan_GTS_with_Fi_Exhaust_system_-_engine_and_exhaust_sound_(YouTube_N4Tbm-bEowk).opus"}];
const TIRE = 2.05;            // m per wheel revolution
const AMBIENT = 18, HOT = 90; // °C coolant

/* ---------- State ---------- */
const $ = (id) => document.getElementById(id);

function setPedal(id, f) {
  f = Math.round(clamp(f, 0, 1) * 50) / 50;
  if (ui[id] === f) return; ui[id] = f;
  const el = $(id); el.firstElementChild.style.transform = `scaleY(${f})`;
  // chevrons light from the foot end: bottom-up on gas, top-down on brake
  const cs = el.querySelectorAll('.chev svg'), n = Math.round(f * 3 + 0.2);
  cs.forEach((c, i) => c.classList.toggle('lit', (id === 'gas' ? cs.length - 1 - i : i) < n));
}
function setMsg(s, cls) { setText('msg', s); if (ui.msgc !== cls) { ui.msgc = cls; $('msg').className = cls || ''; } }
function setLights(n, flash) {
  if (ui.sl === n + (flash ? 'f' : '')) return; ui.sl = n + (flash ? 'f' : '');
  const bs = $('lights').children;
  for (let i = 0; i < 5; i++) bs[i].className = i < n ? (i < 2 ? 'g' : i < 4 ? 'y' : 'r') : '';
  $('lights').classList.toggle('flash', !!flash);
}
function draw() {
  const now = performance.now(), t = (now - phaseT) / 1000;
  const sp = veh.v * (mph ? 2.23694 : 3.6), r = running() ? veh.rpm : 0;
  if (phase === 'check') {
    // needle sweep and lamp test
    const s = Math.sin(Math.PI * clamp(t / 1.6, 0, 1));
    setNeedle('spdN', s); setNeedle('rpmN', s);
    setLights(t < 1.6 ? Math.ceil(s * 5) : 0);
    const c = CHECKS[Math.min(CHECKS.length - 1, Math.floor(t / 0.5))];
    setMsg(c[0], c[1]); setText('gear', 'P');
  } else {
    setNeedle('spdN', sp / spdMax);
    setNeedle('rpmN', r / 1000 / rpmMax);
    const er = effRed();
    if (ui.face !== er) drawRpmFace();
    // shift lights: last 25% before the current limit
    const sl = phase === 'run' ? clamp(Math.floor((r - er * 0.75) / (er * 0.05)) + 1, 0, 5) : 0;
    setLights(sl, sl === 5);
    setText('gear', phase === 'run' ? (veh.neutral || (veh.v < 0.3 && veh.thr < 0.05) ? 'N' : (mode === 'test' ? 'M' : 'D') + veh.gear) : 'P');
    if (phase === 'crank') setMsg('CRANKING', 'warn');
    else if (phase === 'catch') setMsg('RUNNING', 'ok');
    else if (phase === 'stopping') setMsg('OFF', '');
    else if (phase === 'off') setMsg('READY TO START', '');
    else if (veh.over > 0.3 && pops) setMsg('OVERRUN', 'warn');
    else if (warmth() < 1) setMsg(`❄ COLD · ${(er / 1000).toFixed(er % 1000 ? 2 : 0)}k`, 'cold');
    else setMsg('WARM ✓', 'ok');
  }
  setText('speed', String(Math.round(sp)));
  setText('rpm', running() ? String(Math.round(r / 50) * 50) : '0');
  setBar('thr', phase === 'run' ? veh.thr : 0);
  setPedal('gas', phase === 'run' ? veh.thr : 0);
  setPedal('brk', phase === 'run' ? veh.brake : 0);
  setText('gastag', mode === 'gps' && phase === 'run' && veh.neutral ? 'REV' : '');
  setText('thrv', Math.round(phase === 'run' ? veh.thr * 100 : 0) + '%');
  setBar('temp', (veh.temp - AMBIENT) / (HOT + 10 - AMBIENT));
  setText('tempv', Math.round(veh.temp) + '°C');
}

/* ---------- UI ---------- */
function status(msg, warn) { const s = $('status'); s.textContent = msg; s.className = warn ? 'warn' : ''; }
function renderCars() {
  $('cars').innerHTML = CARS.map(c => `<button data-id="${c.id}" class="${c === car ? 'on' : ''}">${c.name}</button>`).join('');
  $('carname').textContent = `${car.name} · ${(car.red / 1000).toFixed(1)}k`;
}
$('credlist').innerHTML = [...CARS.map(c => [c.name, c.credit]), ...POP_CREDITS.map(c => ['Crackle', c])]
  .map(([n, c]) => `<li>${n}: <a href="${c.u}" target="_blank" rel="noopener">${c.t}</a>, by ${c.a}, CC BY 3.0</li>`).join('');
$('info').onclick = () => $('credits').showModal();
$('cars').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  car = CARS.find(c => c.id === b.dataset.id); store.set('car', car.id); prefetch(car);
  veh.gear = 1; renderCars(); drawRpmFace(); ui = {}; draw();
  if (ctx) { try { await loadCar(car); } catch (err) { status('Sound failed: ' + err.message, true); } }
});
$('start').onclick = async () => {
  if (phase === 'off') {
    try { if (!ctx) await audioStart(); else await ctx.resume(); await loadCar(car); }
    catch (err) { return status('Audio failed: ' + err.message, true); }
    veh.temp = restoreTemp(); veh.v = 0; veh.gear = 1; veh.rpm = 0; veh.thr = 0; veh.over = 0;
    eng({ rpm:0, fire:0, starter:0, load:0, over:0, cut:0, pops: pops ? 1 : 0 });
    setPhase('check', performance.now()); chime(); sendVol();
    if (mode === 'gps') gpsStart();
    try { wake = await navigator.wakeLock?.request('screen'); } catch {}
    timerStart(); requestAnimationFrame(frame);
  } else if (phase !== 'stopping') {
    store.set('temp', { t:veh.temp, at:Date.now() });
    gpsStop(); veh.v = 0; veh.thr = 0; wake?.release?.(); wake = null;
    setPhase('stopping', performance.now()); timerStart();
  }
};
function setMode(m) {
  mode = m; $('mGps').classList.toggle('on', m === 'gps'); $('mTest').classList.toggle('on', m === 'test');
  document.body.classList.toggle('test', m === 'test'); document.body.classList.toggle('gps', m === 'gps');
  veh.v = 0;
  if (running()) { if (m === 'gps') gpsStart(); else gpsStop(); }
  status(m === 'gps' ? 'GPS drive · parked: hold gas to rev' : 'Hold gas · lift for pops');
}
$('mGps').onclick = () => setMode('gps');
$('mTest').onclick = () => setMode('test');
for (const [id, k] of [['gas','gas'],['brk','brk']]) {
  const b = $(id), on = (e) => { e.preventDefault(); b.setPointerCapture?.(e.pointerId); pedal[k] = true; b.classList.add('held'); }, off = () => { pedal[k] = false; b.classList.remove('held'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', (e) => e.preventDefault());
}
addEventListener('keydown', (e) => { if (e.key === 'ArrowUp' || e.key === ' ') pedal.gas = true; if (e.key === 'ArrowDown') pedal.brk = true; });
addEventListener('keyup', (e) => { if (e.key === 'ArrowUp' || e.key === ' ') pedal.gas = false; if (e.key === 'ArrowDown') pedal.brk = false; });
function volUi() { $('volv').textContent = $('vol').value; }
$('vol').oninput = () => { volUi(); store.set('vol', +$('vol').value); sendVol(); };
$('vol').value = store.get('vol', 80);
const unitsUi = () => { $('units').textContent = mph ? 'mph' : 'km/h'; $('unit').textContent = mph ? 'MPH' : 'KM/H'; drawSpeedFace(); ui = {}; draw(); };
$('units').onclick = () => { mph = !mph; store.set('mph', mph); unitsUi(); };
const popsUi = () => { $('pops').classList.toggle('on', pops); eng && eng({ pops: pops ? 1 : 0 }); };
$('pops').onclick = () => { pops = !pops; store.set('pops', pops); popsUi(); };
document.addEventListener('visibilitychange', async () => {
  if (running() && document.visibilityState === 'visible') { try { wake = await navigator.wakeLock?.request('screen'); } catch {} ctx?.resume(); }
});
/* line icons (24×24, stroke = currentColor) */
const ICONS = {
  ghost:'<path d="M5 21V11a7 7 0 0 1 14 0v10l-2.3-1.6L14.3 21 12 19.4 9.7 21l-2.4-1.6z"/><circle cx="9.5" cy="11" r="1.1"/><circle cx="14.5" cy="11" r="1.1"/>',
  gps:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  wheel:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><path d="M3.5 10.5 10 12M20.5 10.5 14 12M12 14v7"/>',
  flame:'<path d="M12 22c4 0 7-2.7 7-6.6 0-3.1-2-5.4-3.6-7.2-.3 1.9-1.3 3.1-2.4 3.4C13.6 8 12.4 4.8 9.5 2c.2 3.6-4.5 6.6-4.5 11.4C5 19.3 8 22 12 22z"/>',
  vol:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.1"/>',
  power:'<path d="M12 3v8.5"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>',
  gas:'<path d="m6 13 6-6 6 6M6 19l6-6 6 6"/>',
  brake:'<circle cx="12" cy="12" r="6.5"/><path d="M4.2 7.5a10 10 0 0 0 0 9M19.8 7.5a10 10 0 0 1 0 9"/>',
  gauge:'<path d="M4.5 17a8.5 8.5 0 1 1 15 0"/><path d="m12 13 3.5-4.5"/>',
  temp:'<path d="M10 14.5V5a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 10v6"/>',
};
document.querySelectorAll('.chev').forEach(el => { const d = el.dataset.dir === 'up' ? 'M5 21 16 10l11 11' : 'M5 11l11 11 11-11';
  el.innerHTML = `<svg viewBox="0 0 32 32">${''}<path d="${d}"/></svg>`.repeat(3); });
document.querySelectorAll('[data-i]').forEach(el => { el.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[el.dataset.i]}</svg>`); });
veh.temp = restoreTemp();
prefetch(car);
renderCars(); drawRpmFace(); unitsUi(); popsUi(); volUi();
</script>
</body>
